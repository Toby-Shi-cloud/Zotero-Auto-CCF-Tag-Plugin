<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>
  <html:p data-l10n-id="pref-batch-desc"></html:p>
  <button
    id="zotero-prefpane-__addonRef__-run-library-tagging"
    data-l10n-id="pref-run-batch"
  />
  <separator class="thin" />
  <html:h3>AI 元数据检验</html:h3>
  <html:p
    >开启后会发送论文书目字段和摘要给所选 AI 服务；不会发送
    PDF、笔记或附件。</html:p
  >
  <checkbox id="zotero-prefpane-__addonRef__-ai-enabled" label="开启 AI 模式" />
  <html:h3>API 密钥</html:h3>
  <html:label
    >Google API 密钥
    <html:input id="zotero-prefpane-__addonRef__-key-google" type="password"
  /></html:label>
  <button
    id="zotero-prefpane-__addonRef__-confirm-google"
    label="保存 Google 密钥"
  />
  <html:label
    >OpenAI API 密钥
    <html:input id="zotero-prefpane-__addonRef__-key-openai" type="password"
  /></html:label>
  <button
    id="zotero-prefpane-__addonRef__-confirm-openai"
    label="保存 OpenAI 密钥"
  />
  <html:label
    >Anthropic API 密钥
    <html:input id="zotero-prefpane-__addonRef__-key-anthropic" type="password"
  /></html:label>
  <button
    id="zotero-prefpane-__addonRef__-confirm-anthropic"
    label="保存 Anthropic 密钥"
  />
  <html:h3>自定义服务商</html:h3>
  <html:label
    >服务地址
    <html:input
      id="zotero-prefpane-__addonRef__-ai-base-url"
      type="url"
      placeholder="https://example.com/v1"
  /></html:label>
  <html:label
    >API 密钥
    <html:input id="zotero-prefpane-__addonRef__-key-custom" type="password"
  /></html:label>
  <button
    id="zotero-prefpane-__addonRef__-confirm-custom"
    label="保存自定义服务商"
  />
  <html:label
    >当前服务商
    <html:select id="zotero-prefpane-__addonRef__-ai-provider">
      <html:option value="openai">OpenAI</html:option>
      <html:option value="google">Google</html:option>
      <html:option value="anthropic">Anthropic</html:option>
      <html:option value="custom">自定义服务商</html:option>
    </html:select>
  </html:label>
  <html:label
    >模型
    <html:select id="zotero-prefpane-__addonRef__-ai-model" disabled="disabled">
      <html:option value="">请先获取模型</html:option>
    </html:select></html:label
  >
  <button id="zotero-prefpane-__addonRef__-load-models" label="获取模型" />
  <html:label
    >思考等级
    <html:select id="zotero-prefpane-__addonRef__-ai-effort">
      <html:option value="">不传递</html:option
      ><html:option>none</html:option
      ><html:option>minimal</html:option
      ><html:option>low</html:option
      ><html:option>medium</html:option
      ><html:option>high</html:option
      ><html:option>xhigh</html:option
      ><html:option>max</html:option>
    </html:select></html:label
  >
  <button id="zotero-prefpane-__addonRef__-test-ai" label="测试连接" />
  <button
    id="zotero-prefpane-__addonRef__-run-ai-library"
    label="使用 AI 对整个文件库元数据进行检验"
  />
  <button
    id="zotero-prefpane-__addonRef__-view-reviews"
    label="查看待确认结果"
  />
</groupbox>
<vbox>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
